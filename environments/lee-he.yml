name: rq1-lee-he
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.9
  - pip<25
  - numpy=1.26.4
  - pandas=2.2
  - matplotlib=3.8
  - scikit-learn=1.4
  - psutil=6.1
  - pip:
      # Use official CPU wheels so Conda cannot select a CUDA build on Windows.
      - --extra-index-url https://download.pytorch.org/whl/cpu
      - torch==2.3.0+cpu
      - torchvision==0.18.0+cpu
      - torchtext==0.18.0
      # The conda-forge Pillow 11.3 binary failed to load _imaging on this
      # Windows stack. This wheel is compatible with torchvision 0.18.
      - pillow==10.3.0
      - datasets==4.0.0
      - certifi==2025.8.3
      - phe==1.5.0
      - pycryptodome==3.20.0
      - tenseal==0.3.14
