name: rq1-gia-op
channels:
  - pytorch
  - conda-forge
  - defaults
dependencies:
  - python=3.10
  - pip<25
  - numpy=1.26.4
  - scipy=1.11
  - scikit-image=0.22
  - matplotlib=3.8
  - certifi
  - pip:
      # Keep the attack stack on the same known-working official CPU build.
      - --extra-index-url https://download.pytorch.org/whl/cpu
      - torch==2.3.0+cpu
      - torchvision==0.18.0+cpu
      - pillow==10.3.0
      - kornia==0.7.1
      - lpips==0.1.4
