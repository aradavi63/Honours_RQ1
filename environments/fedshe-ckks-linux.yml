name: rq1-fedshe-ckks
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.9
  - pip<25
  - setuptools<70
  - wheel
  # Pyfhel 3.4.2 vendors a zlib CMake file rejected by CMake 4.x.
  - cmake=3.27.9
  - ninja
  # Pyfhel 3.4.2 requires Cython 3, but does not compile with newer 3.2.x.
  - cython=3.0.10
  - numpy=1.21.6
  - matplotlib=3.5.3
  - pip:
      - --extra-index-url https://download.pytorch.org/whl/cpu
      - torch==1.13.1+cpu
      - torchvision==0.14.1+cpu
      - certifi==2025.8.3
      - pytest==8.3.5
      - pyyaml==6.0.2
      - phe==1.5.0
      # Pyfhel is installed by scripts/setup_fedshe_ckks_wsl.sh because its
      # PyPI archive omits native source and requires --no-build-isolation.
      - tenseal==0.3.14
      - termcolor==1.1.0
