name: rq1-core
channels:
  - pytorch
  - conda-forge
  - defaults
dependencies:
  - python=3.9
  - pip<25
  - numpy=1.26.4
  - scipy=1.11
  - pandas=2.1
  - scikit-learn=1.3
  - matplotlib=3.8
  - seaborn=0.13
  - pyyaml=6
  - tqdm=4.66
  - psutil=5.9
  - pytest=7.4
  - certifi
  - pip:
      # Official CPU wheels avoid incompatible CUDA and OpenMP/MKL solves on Windows.
      - --extra-index-url https://download.pytorch.org/whl/cpu
      - torch==2.3.0+cpu
      - torchvision==0.18.0+cpu
      - pillow==10.3.0
