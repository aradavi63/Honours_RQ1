schema_version: 1
purpose: Trace every RQ1 mechanism from a pinned reference implementation to the controlled shared harness.
claim_rule: A reference is not a runtime dependency unless runtime_dependency is true.

mechanisms:
  fedavg:
    submodule: repos/FedAvg
    commit: 27a0f50efb87c26465dd089a1ddd8ce2c06a9fa1
    relationship: independent_controlled_reimplementation
    runtime_dependency: false
    sources:
      - file: repos/FedAvg/utils.py
        symbols: [average_weights]
      - file: repos/FedAvg/fed_avg.py
        symbols: [FedAvg]
    harness:
      - file: rq1_harness/aggregation.py
        symbols: [weighted_fedavg, add_to_model]
      - file: rq1_harness/training.py
        symbols: [train_client, model_delta]
      - file: scripts/run_e1.py
        symbols: [main]
    retained:
      - Repeated local client training followed by server aggregation.
      - Parameter-wise averaging of compatible client model states or updates.
    changed:
      - The reference average_weights uses an equal arithmetic mean; the harness weights deltas by client sample counts.
      - The harness aggregates model deltas and then adds the result to the global model.
      - Dataset, CNN, partitions, seeds, result schema and validation are shared across all RQ1 mechanisms.
    rationale: Weighted deltas provide one explicit FedAvg contract for equal and unequal client sizes and a plaintext oracle for encrypted backends.
    allowed_claim: Common weighted-FedAvg baseline informed by the pinned FedAvg reference implementation.
    prohibited_claim: The pinned FedAvg repository is executed unchanged by the harness.

  lee_server_initiated_ckks:
    submodule: repos/server-initiated_HE_FL
    commit: 80575b5ff813fb2b4ba1a7786576ca65bf5d3303
    relationship: controlled_structural_adaptation
    runtime_dependency: false
    sources:
      - file: repos/server-initiated_HE_FL/server_node.py
        symbols: [ServerNodeClass.create_ckks_context, ServerNodeClass.decryptWeights]
      - file: repos/server-initiated_HE_FL/network_node.py
        symbols: [NetworkSimulationClass.encryptWeights, NetworkSimulationClass.aggregateEncryptedWeights]
      - file: repos/server-initiated_HE_FL/models/Fed.py
        symbols: [FedAvg]
    harness:
      - file: rq1_harness/e0.py
        symbols: [tenseal_weighted_fedavg]
      - file: scripts/run_e0.py
        symbols: [main]
      - file: scripts/run_e1.py
        symbols: [main]
    retained:
      - TenSEAL CKKS context creation, encrypted vector addition and server-side decryption.
      - Flattening and chunking model parameters before CKKS encoding.
      - Timing of key generation, encryption, aggregation and decryption.
    changed:
      - The harness uses weighted model deltas rather than equal averaging of complete model weights.
      - CKKS chunks use the available slot count rather than the reference's fixed chunk size of 1000.
      - The route topology, GUI, socket simulation and distributed noise-cancellation protocol are omitted.
      - The harness default polynomial modulus degree is 8192, whereas the reference context uses 16384.
    rationale: Isolate the numerical and cost effect of Lee-style server-initiated CKKS aggregation while holding the FL workload constant.
    allowed_claim: Lee-inspired or Lee-style server-initiated TenSEAL CKKS aggregation adapter.
    prohibited_claim: Full reproduction of Lee's multi-route protocol or distributed noise-cancellation scheme.

  fedshe_plain:
    submodule: repos/FedSHE
    commit: 7a354246782b603616b09ed05b4c3fc0cfed92e8
    relationship: controlled_plaintext_control
    runtime_dependency: false
    sources:
      - file: repos/FedSHE/server.py
        symbols: [Server.FedAvg]
    harness:
      - file: rq1_harness/fedshe.py
        symbols: [fedshe_plain_weighted_fedavg]
    retained:
      - A plaintext aggregation condition paired with the encrypted FedSHE condition.
    changed:
      - Uses the study's weighted-delta FedAvg contract instead of FedSHE's equal-client mean.
    rationale: Separate effects of the FedSHE execution path from effects caused specifically by CKKS and published rounding.
    allowed_claim: FedSHE plaintext control in the common harness.
    prohibited_claim: Exact reproduction of FedSHE plaintext training.

  fedshe_ckks:
    submodule: repos/FedSHE
    commit: 7a354246782b603616b09ed05b4c3fc0cfed92e8
    relationship: parameter_and_algorithm_adaptation
    runtime_dependency: true
    sources:
      - file: repos/FedSHE/ModDict.json
        symbols: []
      - file: repos/FedSHE/SegCKKS.py
        symbols: [generate_ckks_key, enc_vector, dec_vector, seg_enc_vector, seg_dec_vector]
      - file: repos/FedSHE/server.py
        symbols: [Server.FedAvg]
    harness:
      - file: rq1_harness/fedshe.py
        symbols: [load_fedshe_ckks_parameters, fedshe_ckks_weighted_fedavg]
    retained:
      - Runtime loading of the pinned ModDict CKKS parameter entries.
      - Pyfhel encodeFrac, encryptPtxt and decryptFrac operations.
      - Slot-based segmentation and concatenation of long vectors.
      - Published three-decimal rounding after decryption.
      - Ciphertext addition before decryption.
    changed:
      - Each update is scaled by its sample-count fraction before encryption to implement weighted FedAvg.
      - Aggregation and tensor reconstruction are placed behind the common harness interface.
      - Timing, serialized ciphertext size and plaintext error metrics are added.
    rationale: Preserve the distinctive published FedSHE CKKS behavior while making its output comparable with the same weighted updates used by other backends.
    allowed_claim: Adapted FedSHE segmented CKKS implementation using the pinned parameter dictionary and published rounding behavior.
    prohibited_claim: Unmodified execution of the complete FedSHE repository.

  targeted_label_poisoning:
    submodule: repos/DataPoisoning_FL
    commit: 467eca0de9c71c1e48f9a0f8894b74fa949fd251
    relationship: controlled_attack_adaptation
    runtime_dependency: false
    sources:
      - file: repos/DataPoisoning_FL/federated_learning/utils/class_flipping_methods.py
        symbols: [replace_1_with_3, replace_1_with_9]
      - file: repos/DataPoisoning_FL/federated_learning/utils/label_replacement.py
        symbols: [apply_class_label_replacement]
      - file: repos/DataPoisoning_FL/federated_learning/utils/poison_data.py
        symbols: [poison_data]
      - file: repos/DataPoisoning_FL/attack_timing.py
        symbols: []
    harness:
      - file: rq1_harness/poisoning.py
        symbols: [select_malicious_clients, attack_is_active, flip_source_labels, attack_metrics]
      - file: rq1_harness/training.py
        symbols: [train_client]
      - file: scripts/run_e2.py
        symbols: [main]
    retained:
      - Selected malicious workers modify source-class labels before local training.
      - Honest workers retain their original local data.
      - Malicious-worker count and attack timing are experimental variables.
    changed:
      - Uses configurable source and target labels, with 1 to 7 used in the current study rather than a copied replacement function.
      - Uses deterministic seeded attacker selection and explicit all-round, first-third and final-third schedules.
      - Adds targeted ASR, source recall, unaffected-class recall and effective source-sample exposure.
      - Runs on the shared MNIST CNN and supports IID and Dirichlet partitions.
    rationale: Preserve the local label-flipping threat model while enabling paired comparisons across plaintext and encrypted aggregation backends.
    allowed_claim: Targeted label-flipping attack adapted from the DataPoisoning_FL threat model and utilities.
    prohibited_claim: Exact reproduction of the submodule's experiments, worker-selection policies or label pair.

  gradient_inversion:
    submodule: repos/GIA
    commit: 405cd4d41344b7514c3e7fcf5a27374934191ae1
    relationship: simplified_gradient_matching_baseline
    runtime_dependency: false
    sources:
      - file: repos/GIA/OP-GIA/IG/inverting.py
        symbols: []
      - file: repos/GIA/OP-GIA/IG/inversefed/reconstruction_algorithms.py
        symbols: [GradientReconstructor.reconstruct, reconstruction_costs, loss_steps]
      - file: repos/GIA/OP-GIA/IG/inversefed/metrics.py
        symbols: [psnr]
    harness:
      - file: rq1_harness/inversion.py
        symbols: [parameter_gradients, average_gradients, infer_single_label, reconstruct_from_gradients, reconstruction_metrics, ciphertext_only_result]
      - file: scripts/run_e3.py
        symbols: [main]
    retained:
      - Optimisation of dummy inputs to reduce mismatch with observed parameter gradients.
      - Evaluation of reconstruction quality and comparison of individual versus aggregated observations.
    changed:
      - Uses a compact squared-gradient-mismatch objective with Adam rather than OP-GIA's full inversefed reconstruction configuration.
      - Adds an iDLG-style single-label inference rule that is not taken from the inspected OP-GIA execution path, which supplies true labels to reconstruct.
      - Omits OP-GIA regularisers, restarts, generative priors, defences and large-model configurations.
      - Compares a fixed single-image attacker with averages of 2, 5 and 10 gradients and records ciphertext-only non-applicability.
    rationale: Provide an understandable observation-granularity baseline that can be run against the common small CNN.
    allowed_claim: Simplified DLG/iDLG-style gradient-matching baseline informed by the pinned GIA/OP-GIA implementation.
    prohibited_claim: Reproduction or implementation of the complete OP-GIA or GEN-GIA attack.

  fedmia_update_membership:
    submodule: repos/FedMIA
    commit: 7e20cbad38bc425f15e2b5c1cfe074b11b6d58b2
    relationship: fedmia_style_algorithm_adaptation
    runtime_dependency: false
    sources:
      - file: repos/FedMIA/main.py
        symbols: [get_all_cos, get_cos_score]
      - file: repos/FedMIA/mia_attack_auto.py
        symbols: [liratio, lira_attack_ldh_cosine, plot_auc]
    harness:
      - file: rq1_harness/membership.py
        symbols: [update_as_gradient_vector, per_sample_gradient_cosines, spatial_temporal_scores, gaussian_out_cdf_scores, membership_metrics]
      - file: scripts/run_e4a.py
        symbols: [main]
    retained:
      - Per-sample gradient versus observed model-gradient cosine similarity.
      - Comparison of a target client with other clients as spatial evidence.
      - Combination of observations across training rounds as temporal evidence.
      - Gaussian modelling of non-target-client scores and ROC/low-FPR evaluation.
    changed:
      - The margin score is a transparent target-minus-nontarget heuristic not copied from FedMIA.
      - The Gaussian-CDF extension fits non-target clients within each round rather than reproducing the full multi-shadow-client likelihood-ratio pipeline.
      - Uses model deltas converted to approximate gradient direction instead of the original optimiser/Opacus pipeline.
      - Adds route-aggregate, collusion, ciphertext-only and class-matched non-IID observation controls.
    rationale: Test FedMIA's central spatial-temporal update-leakage idea under the same small FL workload used by all RQ1 mechanisms.
    allowed_claim: FedMIA-style spatial-temporal update membership attack.
    prohibited_claim: Full reproduction of FedMIA or its complete Gaussian likelihood-ratio and sample-selection pipeline.

  black_box_membership:
    submodule: repos/FedMIA
    commit: 7e20cbad38bc425f15e2b5c1cfe074b11b6d58b2
    relationship: standard_baseline_with_reference_overlap
    runtime_dependency: false
    sources:
      - file: repos/FedMIA/main.py
        symbols: [get_all_losses]
      - file: repos/FedMIA/mia_attack_auto.py
        symbols: [common_attack, plot_auc]
    harness:
      - file: rq1_harness/membership.py
        symbols: [per_sample_scores, membership_metrics]
      - file: scripts/run_e4b.py
        symbols: [main]
    retained:
      - Per-sample loss extraction and ROC-based separation of members from non-members.
    changed:
      - Adds true-class confidence as a second standard black-box score.
      - Attacks the common final global model without FedMIA's shadow-client pipeline.
    rationale: Provide an architecture-independent final-model baseline alongside the training-update attack.
    allowed_claim: Standard loss/confidence black-box membership baseline; conceptually overlapping with FedMIA's loss baseline.
    prohibited_claim: FedMIA reproduction.
