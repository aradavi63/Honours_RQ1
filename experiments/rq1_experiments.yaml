      fraction_0p2_first_third_final_accuracy_mean: 0.75242
      fraction_0p2_final_third_final_accuracy_mean: 0.75292
      interpretation: In this five-round IID pilot, label flipping is most effective during early model formation; the mature model largely resists attacks introduced only in rounds four and five.
    lee_ckks_timing_summary:
      targeted_asr_difference_from_plaintext_all_100_rounds: 0.0
      max_absolute_accuracy_difference_from_plaintext: 0.0002
      mean_relative_l2_error: 0.000001126345449397307
      max_relative_l2_error: 0.0000016802022513832035
      interpretation: Lee CKKS preserves the timing conclusion; negligible approximation error changes a few accuracy values but no targeted ASR values.
    fedshe_ckks_timing_summary:
      fraction_0p1_first_third_peak_asr_mean: 0.2974449339207048
      fraction_0p1_final_third_peak_asr_mean: 0.01145374449339207
      fraction_0p2_first_third_peak_asr_mean: 0.5904845814977974
