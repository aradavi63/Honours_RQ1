# Executable registry for the staged RQ1 study. A pending entry is a plan, not a result.
schema_version: 1

study:
  id: rq1_fl_security_comparison
  title: Controlled evaluation of Lee HE-FL under privacy and integrity attacks
  dataset: MNIST
  confirmatory_dataset: CIFAR10
  model: common_cnn
  num_users: 10
  num_samples_per_user: 100
  non_iid_alpha: 1.0
  local_epochs: 1
  global_rounds: 20
  seeds: [1, 2, 3, 4, 5]
  device: cpu

common_paths:
  project_root: .
  lee_repo: repos/server-initiated_HE_FL
  fedshe_repo: repos/FedSHE
  fedavg_repo: repos/FedAvg
  gradient_attack_repo: repos/GIA
  poisoning_attack_repo: repos/DataPoisoning_FL
  membership_attack_repo: repos/FedMIA
  results_root: results

mechanisms:
  fedavg:
    status: ready_e0
    role: Plain weighted-FedAvg correctness oracle
    environment: environment.yml
    runner: scripts/run_e0.py
    backend: plaintext
  lee_he:
    status: ready_e0
    role: Main server-initiated CKKS mechanism
    environment: environments/lee-he.yml
    runner: scripts/run_e0.py
    backend: lee_ckks
  fedshe_plain:
    status: adapter_pending
    role: FedSHE plaintext control
    environment: environments/fedshe-plain-windows.yml
    runner: scripts/run_e0.py
    backend: plaintext
  fedshe_ckks:
    status: adapter_pending_linux
    role: FedSHE segmented CKKS comparison
    environment: environments/fedshe-ckks-linux.yml
    runner: scripts/run_e0.py
    backend: plaintext

experiments:
  e0_aggregation_correctness:
    status: completed
    runner: scripts/run_e0_matrix.py
    result_files: [results/e0/plaintext.csv, results/e0/lee_ckks.csv]
    completed_runs: 40
    client_counts: [1, 2, 5, 10]
    seeds: [1, 2, 3, 4, 5]
    backends: [plaintext, lee_ckks]
    acceptance:
      max_relative_l2_error: 0.001
      min_cosine_similarity: 0.9999
    metrics: [max_absolute_error, mean_absolute_error, relative_l2_error, cosine_similarity, key_generation_seconds, encryption_seconds, aggregation_seconds, decryption_seconds, ciphertext_bytes]
  e1_utility_efficiency:
    status: mnist_smoke_validated
    runner: scripts/run_e1.py
    implemented_mechanisms: [fedavg, lee_he]
    pending_mechanisms: [fedshe_plain, fedshe_ckks]
    smoke_configuration:
      clients: 2
      samples_per_client: 50
      rounds: 1
      seed: 1
    result_files: [results/e1/mnist_plaintext_smoke.csv, results/e1/mnist_lee_ckks_smoke.csv]
    metrics: [test_accuracy, macro_f1, round_seconds, peak_memory_mb, network_bytes]
  e2_targeted_label_flipping:
    status: training_adapter_pending
    threat_model: malicious_clients
    source_label: 1
    target_label: 7
    malicious_fractions: [0.0, 0.1, 0.2]
    attack_schedules: [all_rounds, first_third, final_third]
    metrics: [test_accuracy, source_recall, targeted_attack_success_rate, unaffected_macro_recall]
  e3_gradient_inversion:
    status: observation_adapter_pending
    implementation: repos/GIA/OP-GIA/IG
    observations: [individual_plaintext, aggregate_2, aggregate_5, aggregate_10, ciphertext_only]
    metrics: [mse, psnr, ssim, lpips, label_recovery, applicability]
  e4a_fedmia_update_based:
    status: observation_adapter_pending
    implementation: repos/FedMIA
    observations: [individual_plaintext, route_aggregate, ciphertext_only, colluding_clients]
    metrics: [roc_auc, tpr_at_fpr_01, tpr_at_fpr_001, membership_advantage, applicability]
  e4b_blackbox_membership:
    status: model_adapter_pending
    observations: [global_model]
    metrics: [loss_auc, confidence_auc, tpr_at_fpr_01, tpr_at_fpr_001]
